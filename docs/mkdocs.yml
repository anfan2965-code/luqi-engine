site_name: 鹿栖AI引擎 API 参考
theme:
  name: readthedocs
  language: zh
nav:
  - Home: index.md
  - API Reference:
      - Core: api/core.md
      - Engine: api/engine.md
      - LLM: api/llm.md
      - Character: api/character.md
      - Narrative: api/narrative.md
      - Scene: api/scene.md
      - Interaction: api/interaction.md
      - WorldView: api/worldview.md
      - Config: api/config.md
plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            heading_level: 3
            separate_signature: true
            show_root_heading: true
            show_root_toc_entry: true
            docstring_options:
              ignore_init_summary: true
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - codehilite
