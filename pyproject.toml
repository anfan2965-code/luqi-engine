[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luqi-engine"
version = "1.3.0.12-beta"
description = "离线优先的拟人化对话引擎 - 鹿栖AI世界基础与角色引擎"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "LuqiAI Team" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.24.0,<1.0",
    "jieba>=0.42.1,<1.0",
    "numpy>=1.24.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
    "FlagEmbedding>=1.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "safety>=2.0",
]

[project.scripts]
luqi-engine = "luqi_engine.engine:main"

[project.urls]
Homepage = "https://github.com/luqiai/luqi-engine"
Repository = "https://github.com/luqiai/luqi-engine"
Issues = "https://github.com/luqiai/luqi-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["luqi_engine"]

[tool.pytest.ini_options]
testpaths = ["luqi_engine/tests"]
addopts = "--cov=luqi_engine --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["luqi_engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
